<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <p><label>Username <input type="text" name="username"></label></p>
        <p><label>Password <input type="password" name="password"></label></p>
        <button type="submit">Masuk</button>
    </form>
</body>
</html>
