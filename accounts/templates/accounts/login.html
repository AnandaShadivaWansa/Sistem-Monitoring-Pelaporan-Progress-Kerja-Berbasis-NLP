{% extends 'base.html' %}
{% load static %}

{% block title %}Masuk | WorkPulse{% endblock %}

{% block content %}
<main class="flex min-h-screen items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">

        <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
            <div class="mb-4 flex justify-center">
                <img src="{% static 'accounts/logo.jpeg' %}" alt="WorkPulse"
                     class="h-32 w-auto object-contain mix-blend-multiply" onerror="this.style.display='none'">
            </div>

            <h1 class="text-center text-2xl font-bold text-navy">Selamat datang</h1>
            <p class="mt-1 text-center text-sm text-slate-500">Masuk ke sistem pelaporan progress kerja</p>

            {% if error %}
            <div class="mt-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" class="mt-6 space-y-4">
                {% csrf_token %}
                <div>
                    <label for="username" class="mb-1 block text-sm font-medium text-slate-700">Username</label>
                    <input id="username" type="text" name="username" required autofocus autocomplete="username"
                           placeholder="Masukkan username"
                           class="w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-500/20">
                </div>
                <div>
                    <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
                    <input id="password" type="password" name="password" required autocomplete="current-password"
                           placeholder="Masukkan password"
                           class="w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-500/20">
                </div>
                <button type="submit"
                        class="w-full rounded-lg bg-brand-600 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
                    Masuk
                </button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
